providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
dependsOn = ["setup"]
cmds = ["npm ci --include=dev"]
cacheDirectories = ["node_modules"]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build:app"]

[start]
cmd = "sh -c 'npm run preview -- --host 0.0.0.0 --port ${PORT:-4173}'"
