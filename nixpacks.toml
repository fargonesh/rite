providers = ["node"]

[variables]
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
dependsOn = ["setup"]
cmds = ["npm ci"]
cacheDirectories = ["node_modules"]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build:app"]

[start]
cmd = "npm run preview -- --host 0.0.0.0 --port ${PORT:-4173}"